# HAProxy 3.4 LTS in front of a Yoal ingress set (`external-lb` driver).
#
# Replace 10.0.0.21-23 with the ingress nodes and 10.0.0.10/32 with each HAProxy's source address
# in `ingress.trustedProxies`. Probe path/port and timings are from S9 (docs/SPIKES.md) and meet the
# 15 s removal bound in HA-PLAN §1.2. Do not add `on-marked-down shutdown-sessions`: S9 measured it
# resetting requests a draining node was still serving.

global
  log stdout format raw local0
  maxconn 20000
  tune.ssl.default-dh-param 2048

defaults
  log global
  timeout connect 3s
  timeout client  30s
  timeout server  30s
  timeout check   2s
  retries 2

frontend fe_https
  bind :443 ssl crt /etc/haproxy/tls.pem alpn h2,http/1.1
  default_backend be_ingress

frontend fe_http
  bind :80
  default_backend be_ingress

# L7 is the recommended shape: it keeps client keep-alives across Caddy reloads (S9 criterion 4).
backend be_ingress
  mode http
  balance leastconn
  option httpchk GET /.well-known/yoal/health
  http-check expect status 200
  default-server check inter 5s fall 2 rise 2 send-proxy-v2 ssl verify none sni req.hdr(host)
  option redispatch
  server ing-a 10.0.0.21:443
  server ing-b 10.0.0.22:443
  server ing-c 10.0.0.23:443

# L4 passthrough, the cloud NLB / Azure LB / Hetzner LB shape (uncomment and drop be_ingress).
# The probe goes to the plain health port, never through the PROXY wrapper.
#
# backend be_ingress_tcp
#   mode tcp
#   balance leastconn
#   option httpchk GET /.well-known/yoal/health
#   http-check expect status 200
#   default-server check inter 5s fall 2 rise 2 send-proxy-v2
#   server ing-a 10.0.0.21:443 check port 8099
#   server ing-b 10.0.0.22:443 check port 8099
#   server ing-c 10.0.0.23:443 check port 8099
