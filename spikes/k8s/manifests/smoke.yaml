apiVersion: apps/v1
kind: Deployment
metadata: {name: hello, namespace: default}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello}}
  template:
    metadata: {labels: {app: hello}}
    spec:
      containers:
      - name: web
        image: docker.io/traefik/whoami:v1.10
        ports: [{containerPort: 80}]
        resources: {requests: {memory: 16Mi, cpu: 10m}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: hello, namespace: default}
spec:
  selector: {app: hello}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: hello, namespace: default}
spec:
  rules:
  - host: hello.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: hello, port: {number: 80}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: default}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Mi}}
---
# privileged pod with the machine's / mounted: what does a cluster admin see/write?
apiVersion: v1
kind: Pod
metadata: {name: escape, namespace: default}
spec:
  hostPID: true
  hostNetwork: true
  containers:
  - name: sh
    image: docker.io/library/busybox:1.37
    command: [sh, -c, "echo pwned > /host/yoal-escape-test && sleep 3600"]
    securityContext: {privileged: true}
    volumeMounts:
    - {name: host, mountPath: /host}
    - {name: data, mountPath: /data}
  volumes:
  - {name: host, hostPath: {path: /}}
  - {name: data, persistentVolumeClaim: {claimName: data}}
